[package]
name = "novaos-identity"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[features]
administration-lab = ["recuperation-lab"]
recuperation-lab = ["distribution-lab"]
politiques-lab = []
distribution-lab = ["politiques-lab", "dep:ed25519-dalek"]

[workspace]

[dependencies]
ed25519-dalek = { version = "=2.2.0", optional = true, default-features = false }
novafs = { path = "../../../novaFS" }
sha2 = { version = "0.10.9", default-features = false }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[[example]]
name = "policy_volume"
required-features = ["politiques-lab"]

[profile.release]
overflow-checks = true

[[example]]
name = "exec_volume"
required-features = ["distribution-lab"]

[[example]]
name = "recovery_volume"
required-features = ["recuperation-lab"]

[[example]]
name = "recovery_vfs_volume"
required-features = ["recuperation-lab"]

[[example]]
name = "recovery_inspect"
required-features = ["recuperation-lab"]

[[example]]
name = "exec_admission_volume"
required-features = ["recuperation-lab"]

[[example]]
name = "administration_volume"
required-features = ["administration-lab"]

[[example]]
name = "administration_r2_volume"
required-features = ["administration-lab"]
