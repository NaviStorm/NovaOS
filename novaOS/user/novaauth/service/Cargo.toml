[package]
name = "novaos-auth-session"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]

[dependencies]
zeroize = { version = "1", default-features = false }
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["zeroize"] }
sha2 = { version = "0.10.9", default-features = false }

[profile.release]
panic = "abort"
overflow-checks = true
