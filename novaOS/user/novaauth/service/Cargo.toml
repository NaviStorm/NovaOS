[package]
name = "novaos-auth-session"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]

[features]
administration-lab = []
administration-guest = ["exec-admission-guest", "administration-lab", "novaos-identity/administration-lab"]
guest = []
incarnation-guest = ["shell-guest"]
tete-guest = ["horloge-guest"]
vfs-guest = ["vue-guest"]
exec-admission-guest = ["vfs-guest"]
vue-guest = ["activation-guest", "dep:novaos-identity", "dep:dlmalloc", "dep:spin"]
activation-guest = ["triplet-guest"]
triplet-guest = ["recuperation-guest"]
recuperation-guest = ["tete-guest", "dep:novaos-recovery"]
horloge-guest = ["incarnation-guest", "dep:embedded-tls", "dep:embedded-io", "dep:rand_core", "dep:signature"]
policy-guest = ["guest"]
shell-guest = ["guest"]

[[bin]]
name = "exec-relay"
path = "src/bin/exec-relay.rs"
required-features = ["shell-guest"]
test = false

[[bin]]
name = "shell-signer"
path = "src/bin/shell-signer.rs"
required-features = ["shell-guest"]
test = false

[[bin]]
name = "sign-alice"
path = "src/bin/sign-alice.rs"
required-features = ["policy-guest"]
test = false

[[bin]]
name = "sign-bob"
path = "src/bin/sign-bob.rs"
required-features = ["policy-guest"]
test = false

[[bin]]
name = "policy-update"
path = "src/bin/policy-update.rs"
required-features = ["policy-guest"]
test = false

[[bin]]
name = "policy-app"
path = "src/bin/policy-app.rs"
required-features = ["policy-guest"]
test = false

[[bin]]
name = "auth-verifier"
path = "src/bin/verifier.rs"
required-features = ["guest"]
test = false

[[bin]]
name = "auth-client"
path = "src/bin/client.rs"
required-features = ["guest"]
test = false

[dependencies]
novaos-identity = { path = "..", optional = true, features = ["recuperation-lab"] }
dlmalloc = { version = "=0.2.14", default-features = false, optional = true }
spin = { version = "=0.9.9", default-features = false, features = ["mutex", "spin_mutex"], optional = true }
novaos-recovery = { path = "../recuperation", optional = true }
embedded-tls = { version = "=0.19.0", default-features = false, optional = true }
embedded-io = { version = "0.7", default-features = false, optional = true }
rand_core = { version = "0.6", default-features = false, optional = true }
signature = { version = "2.2", default-features = false, optional = true }
zeroize = { version = "1", default-features = false }
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["zeroize"] }
sha2 = { version = "0.10.9", default-features = false }

[profile.release]
panic = "abort"
overflow-checks = true

[[bin]]
name = "registre-incarnation"
path = "src/bin/registre-incarnation.rs"
required-features = ["incarnation-guest"]
test = false

[[bin]]
name = "signataire-incarnation"
path = "src/bin/signataire-incarnation.rs"
required-features = ["incarnation-guest"]
test = false

[[bin]]
name = "recovery-alice"
path = "src/bin/recovery-alice.rs"
required-features = ["vfs-guest"]
test = false

[[bin]]
name = "recovery-bob"
path = "src/bin/recovery-bob.rs"
required-features = ["vfs-guest"]
test = false
