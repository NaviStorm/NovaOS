[package]
name = "novaos-storage"
version = "0.16.6"
edition = "2024"
license = "MIT"
publish = false

[workspace]
[[bin]]
name = "novaos-storage"
path = "main.rs"
test = false

[features]
installation = []

[dependencies]
novafs = { path = "../../../novaFS" }
zeroize = { version = "1.9.1", default-features = false }
dlmalloc = "0.2.14"
spin = { version = "0.9.9", default-features = false, features = ["spin_mutex","mutex"] }

[profile.release]
panic = "abort"
overflow-checks = true
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# Chemin chaud du contrôle P9. Le backend portable SHA-256 reste identique.
[profile.release.package.novafs]
opt-level = 2

[profile.release.package.sha2]
opt-level = 3
