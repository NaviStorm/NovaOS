[package]
name = "novaos-uefi-standard"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]

[[bin]]
name = "standard"
path = "entree.rs"
test = false
required-features = ["efi"]

[features]
efi = []
default = ["diagnostic-5h", "diagnostic-5w"]
diagnostic-5h = []
diagnostic-5w = []

[dependencies]
sha2 = { version = "=0.10.9", default-features = false }
r-efi = "=6.0.0"
novaos-catalogue = { path = "../../libs/catalogue-pilotes" }
novaos-vtd-multi = { path = "../diagnostic-5u" }

[profile.release]
panic = "abort"
lto = true
overflow-checks = true
codegen-units = 1
strip = true
