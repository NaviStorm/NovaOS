[package]
name = "novaos-transfert-usb-labo"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
path = "signature.rs"
crate-type = ["staticlib"]

[dependencies]
ed25519-dalek = { version = "=2.2.0", default-features = false }
sha2 = { version = "=0.10.9", default-features = false }

[profile.release]
panic = "abort"
opt-level = "s"
codegen-units = 1
lto = true
