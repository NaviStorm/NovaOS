[package]
name="novaos-diagnostic-usb"
version="0.1.0"
edition="2024"
license="MIT"
publish=false

[workspace]

[[bin]]
name="diagnostic-5r"
path="entree.rs"
test=false
bench=false

[dependencies]
ed25519-dalek={version="=2.2.0", default-features=false}
sha2={version="=0.10.9", default-features=false}
serde={version="=1.0.229", default-features=false, features=["derive","alloc"]}
serde_json={version="=1.0.154", default-features=false, features=["alloc"]}
r-efi="=6.0.0"
novaos-catalogue={path="../../libs/catalogue-pilotes"}

[build-dependencies]
sha2={version="=0.10.9", default-features=false}

[profile.release]
panic="abort"
overflow-checks=true
codegen-units=1
lto=true
strip=true
