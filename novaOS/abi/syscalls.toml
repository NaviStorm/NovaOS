# Registre canonique des sélecteurs effectivement dispatchés, commun aux deux ISA.
# Trois mots u64. « — » indique un argument inutilisé, 0 un zéro requis.
# La clé de [call] forme NOVA_SYS_<clé> en C. rust_name précise le nom court
# de la constante Rust lorsqu’il diffère de la clé ; module la qualifie.
schema_version = 1
abi_version = 1
default_status = "active"
endianness = "little"
word_bits = 64
reserved = [[0x1002a, 0x1002b], [0x1002e, 0x1003a]]
reservation_source = "docs/es-v0.16.6-integration-interfaces.md"
layout_source = "abi/native.rs.in"
status_source = "abi/native.rs.in"

statuses = ["OK", "BAD_VERSION", "UNKNOWN_CALL", "BAD_ARGUMENT", "BAD_ADDRESS", "DENIED", "LIMIT", "WOULD_BLOCK", "TIMED_OUT", "CANCELLED", "REVOKED", "CLOSED", "REFUSED", "NO_MEMORY"]

# Taille et alignement en octets des structures repr(C) de l’ABI v1.
[layout]
Reply = [16, 8]
WaitInfo = [32, 8]
BulkV1 = [32, 8]
SendV1 = [160, 8]
ReceiveV1 = [184, 8]
GiveV1 = [48, 8]

[calling.x86_64]
instruction = "syscall"
selector = "RAX"
arguments = ["RDI", "RSI", "RDX"]
reply = ["RAX", "RDX"]

[calling.aarch64]
instruction = "svc #0x4e"
selector = "x8"
arguments = ["x0", "x1", "x2"]
reply = ["x0", "x1"]

