[package]
name = "novaos-catalogue"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]

[dependencies]
toml_datetime = { version = "=1.1.2", default-features = false }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }

sha2 = { version = "0.10.9", default-features = false }
ed25519-dalek = { version = "=2.2.0", default-features = false }

[target.'cfg(not(target_os = "uefi"))'.dependencies]
novaos-identity = { path = "../../user/novaauth", features = ["distribution-lab"] }

[profile.release]
overflow-checks = true

[dependencies.toml_parser]
version = "=1.1.5"
default-features = false

[dev-dependencies]
toml = { version = "=1.1.6", default-features = false, features = ["parse","serde"] }
