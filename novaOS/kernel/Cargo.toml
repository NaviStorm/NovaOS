[package]
name = "novaos"
version = "0.20.0"
edition = "2024"
publish = false

[[bin]]
name = "novaos"
path = "src/main.rs"
test = false
bench = false

[features]
novaauth-lab = []
materiel-lab = []
vtd-lab = ["materiel-lab"]
nvme-lab = ["vtd-lab"]
user-fpu = []
thread-probe = ["user-fpu"]
journal-pannes-lab = []
ipc-smp-lab = []
net-event-idx = []
net-ethernet-lab = ["net-event-idx"]
net-q35-lab = ["vtd-lab"]
net-arm-mesure = ["systeme-gpt"]
net-arm-lab = ["net-arm-mesure"]
gestionnaire-4e1 = ["gestionnaire-4d"]
gestionnaire-4d = ["net-arm-lab", "ethernet-v1-port"]
ethernet-v1-port = ["net-ethernet-lab"]
ethernet-ipc-lab = []
ethernet-2b-lab = ["ethernet-ipc-lab"]
ethernet-2b-course = ["ethernet-2b-lab"]
ipc-equite-lab = ["ipc-smp-lab"]
gicv3-lab = []
dma-sequentiel = ["gicv3-lab"]
ancres-p9-lab = ["dma-sequentiel"]
pc1-lab = ["ancres-p9-lab", "dep:hmac"]
systeme-gpt = ["dma-sequentiel"]
installation-gpt = ["systeme-gpt"]

[dependencies]
limine = "=0.5.0"
font8x8 = { version = "0.3.1", default-features = false }
sha2 = { version = "=0.10.9", default-features = false, features = ["force-soft"] }
hmac = { version = "=0.12.1", default-features = false, optional = true }

[target.'cfg(target_arch = "x86_64")'.dependencies]
pc-keyboard = "0.9.0"
