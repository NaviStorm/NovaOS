[package]
name = "novaos"
version = "0.15.0"
edition = "2024"
publish = false

[[bin]]
name = "novaos"
path = "src/main.rs"
test = false
bench = false

[features]
gicv3-lab = []
dma-sequentiel = ["gicv3-lab"]
systeme-gpt = ["dma-sequentiel"]
installation-gpt = ["systeme-gpt"]

[dependencies]
limine = "=0.5.0"
font8x8 = { version = "0.3.1", default-features = false }

[target.'cfg(target_arch = "x86_64")'.dependencies]
pc-keyboard = "0.9.0"
