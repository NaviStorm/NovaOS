[package]
name = "novafs"
version = "0.9.8"
edition = "2024"
license = "MPL-2.0"
publish = false
default-run = "novafs"
description = "Laboratoire NovaFS P6 sur images temporaires"

[[bin]]
name = "novafs-bench"
path = "lab/novafs-bench.rs"

[[example]]
name = "p1-image"
path = "lab/p1-image.rs"

[[example]]
name = "txn-latency"
path = "lab/txn_latency.rs"

[[example]]
name = "profile-read"
path = "lab/profile-read.rs"
required-features = ["latency-probes"]

[workspace]

[features]
check-metrics = []
bench-coordinator = []
latency-probes = []

[dependencies]
getrandom = "0.4"
serde_json = "1"
sha2 = "0.10.9"
tempfile = "3.27"

[profile.release]
overflow-checks = true
