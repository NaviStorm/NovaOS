[package]
name = "novafs"
version = "0.9.12"
edition = "2024"
license = "MPL-2.0"
publish = false
default-run = "novafs"
description = "Laboratoire NovaFS sur images temporaires"

[[bin]]
name = "novafs-bench"
path = "lab/novafs-bench.rs"

[[example]]
name = "p1-image"
path = "lab/p1-image.rs"

[[example]]
name = "txn-latency"
path = "lab/txn_latency.rs"

[[example]]
name = "profile-read"
path = "lab/profile-read.rs"
required-features = ["latency-probes"]

[workspace]

[features]
check-metrics = []
bench-coordinator = []
latency-probes = []

[dependencies]
argon2 = { version = "0.6.0", default-features = false, features = ["zeroize"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["zeroize"] }
getrandom = "0.4"
hkdf = { version = "0.13.0", default-features = false }
hmac = { version = "0.13.0", default-features = false, features = ["zeroize"] }
# Le feature zeroize de l'AEAD active ChaCha20 mais pas Poly1305.
poly1305 = { version = "0.9.1", default-features = false, features = ["zeroize"] }
serde_json = "1"
sha2 = { version = "0.10.9", default-features = false }
sha2-p7 = { package = "sha2", version = "0.11.1", default-features = false, features = ["zeroize"] }
tempfile = "3.27"
zeroize = { version = "1.9.1", default-features = false, features = ["alloc"] }

[profile.release]
overflow-checks = true
