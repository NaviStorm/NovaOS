[package]
name = "novafs"
version = "0.9.3"
edition = "2024"
publish = false
default-run = "novafs"
description = "Laboratoire NovaFS P3 sur images temporaires"

[[bin]]
name = "novafs-bench"
path = "lab/novafs-bench.rs"

[[example]]
name = "p1-image"
path = "lab/p1-image.rs"

[workspace]

[features]
check-metrics = []

[dependencies]
getrandom = "0.4"
serde_json = "1"
sha2 = "0.10.9"
tempfile = "3.27"

[profile.release]
overflow-checks = true
