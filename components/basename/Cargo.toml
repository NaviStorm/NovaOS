[package]
name = "nova-basename"
version = "0.24.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]

[[bin]]
name = "basename"
path = "src/main.rs"

[target.'cfg(target_os = "none")'.dependencies]
nova-cli = { path = ".." }

[profile.release]
panic = "abort"
strip = true
lto = true
codegen-units = 1
