[package]
name = "nova-printf"
version = "0.24.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]

[[bin]]
name = "printf"
path = "src/main.rs"

[dependencies]
num-bigint = { version = "=0.4.8", default-features = false }

[target.'cfg(target_os = "none")'.dependencies]
nova-cli = { path = ".." }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "=0.2.191"

[features]
sonde = []

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1
