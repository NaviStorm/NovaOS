[package]
name = "uu_grep"
description = "A Rust implementation of GNU Grep"
repository = "https://github.com/uutils/grep"
edition = "2024"
rust-version = "1.88.0"
version = "0.2.0"
license = "MIT"
keywords = ["grep", "uutils", "cross-platform", "cli", "utility"]
categories = ["command-line-utilities"]

[[bin]]
name = "grep"
path = "src/main.rs"

[lib]
name = "uu_grep"
path = "src/lib.rs"

[dependencies]
tempfile = "3.27"
memmap2 = "0.9"
grep-engine = { path = "engine" }
clap = { version = "4.5", features = ["wrap_help", "cargo", "color"] }
glob = "0.3.1"
memchr = "2.7.2"
onig = { version = "~6.5.1", default-features = false }
onig_sys = { version = "69.9.3", default-features = false }
uucore = "0.12.0"
walkdir = "2.5"

[build-dependencies]
cc = "1"
pkg-config = "0.3"

[profile.release]
lto = "fat"
panic = "abort"
codegen-units = 1

[profile.dist]
inherits = "release"
[workspace]
