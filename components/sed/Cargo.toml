[package]
name = "nova-sed"
version = "0.1.0"
edition = "2024"
license = "MIT AND BSD-2-Clause AND BSD-3-Clause"
publish = false

[features]
qualification = []

[workspace]

[[bin]]
name = "sed"
path = "src/main.rs"

[build-dependencies]
cc = "1"

[target.'cfg(not(target_os = "none"))'.dependencies]
tempfile = "3"

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
