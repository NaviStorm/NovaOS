[package]
name = "nova-cli"
version = "0.16.2"
edition = "2024"
publish = false
license = "MIT"

[workspace]

[lib]
path = "libraries/lib.rs"
test = false

[dependencies]
unicode-width = { version = "=0.2.2", default-features = false }
dlmalloc = "0.2.14"
spin = { version = "0.9.9", default-features = false, features = ["spin_mutex", "mutex"] }

[profile.release]
panic = "abort"
overflow-checks = true
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[[bin]]
name = "nsh"
path = "shell/main.rs"
test = false

[[bin]]
name = "pwd"
path = "coreutils/pwd.rs"
test = false

[[bin]]
name = "ls"
path = "coreutils/ls.rs"
test = false

[[bin]]
name = "cat"
path = "coreutils/cat.rs"
test = false

[[bin]]
name = "head"
path = "coreutils/head.rs"
test = false

[[bin]]
name = "mkdir"
path = "coreutils/mkdir.rs"
test = false

[[bin]]
name = "rm"
path = "coreutils/rm.rs"
test = false

[[bin]]
name = "probe"
path = "coreutils/probe.rs"
test = false

[[bin]]
name = "cp"
path = "coreutils/cp.rs"
test = false

[[bin]]
name = "mv"
path = "coreutils/mv.rs"
test = false

[[bin]]
name = "touch"
path = "coreutils/touch.rs"
test = false

[[bin]]
name = "more"
path = "coreutils/more.rs"
test = false

[[bin]]
name = "wc"
path = "coreutils/wc.rs"
test = false

[[bin]]
name = "tail"
path = "coreutils/tail.rs"
test = false

[[bin]]
name = "rmdir"
path = "coreutils/rmdir.rs"
test = false

[[bin]]
name = "vi"
path = "vi/main.rs"
test = false
