[package]
name = "nova-sort"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]

[[bin]]
name = "sort"
path = "src/main.rs"

[target.'cfg(target_os = "none")'.dependencies]
nova-cli = { path = ".." }

[target.'cfg(not(target_os = "none"))'.dependencies]
rayon = "1"
tempfile = "3"
libc = "0.2"

[features]
qualification = []

[profile.release]
panic = "abort"
lto = true
codegen-units = 1

[dependencies]
md-5 = { version = "0.10.6", default-features = false }
