[workspace]

[package]
name = "nova-awk"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "awk_rs"

[[bin]]
name = "awk"
path = "src/main.rs"
required-features = ["darwin"]

[features]
default = ["darwin"]
darwin = ["no_std_io2/std", "regex/std", "thiserror/std"]

[dependencies]
regex = { version = "1", default-features = false, features = ["unicode", "perf"] }
regex-automata = { version = "0.4.13", default-features = false, features = ["dfa-build", "syntax", "unicode"] }
thiserror = { version = "2", default-features = false }
no_std_io2 = { version = "0.9.4", features = ["alloc"] }
libm = "0.2.16"
memchr = { version = "2", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
