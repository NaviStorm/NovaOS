[package]
name = "nova-exec-client"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[features]
administration-qemu = []
guest = []

[[bin]]
name = "cat"
path = "src/bin/cat.rs"
required-features = ["guest"]
test = false

[[bin]]
name = "prefixe-temoin"
path = "src/bin/prefixe-temoin.rs"
required-features = ["guest"]
test = false

[[bin]]
name = "temoin"
path = "src/bin/temoin.rs"
required-features = ["guest"]
test = false

[workspace]

[target.'cfg(target_os = "none")'.dependencies]
nova-cli = { path = ".." }

[profile.release]
panic = "abort"
lto = true
codegen-units = 1

[[bin]]
name = "admin-sonde"
path = "src/bin/admin-sonde.rs"
required-features = ["guest", "administration-qemu"]
test = false

[[bin]]
name = "whoami"
path = "src/bin/whoami.rs"
required-features = ["guest", "administration-qemu"]
test = false

[[bin]]
name = "id"
path = "src/bin/id.rs"
required-features = ["guest", "administration-qemu"]
test = false

[[bin]]
name = "groups"
path = "src/bin/groups.rs"
required-features = ["guest", "administration-qemu"]
test = false

[[bin]]
name = "useradd"
path = "src/bin/useradd.rs"
required-features = ["guest", "administration-qemu"]
test = false

[[bin]]
name = "usermod"
path = "src/bin/usermod.rs"
required-features = ["guest", "administration-qemu"]
test = false

[[bin]]
name = "groupadd"
path = "src/bin/groupadd.rs"
required-features = ["guest", "administration-qemu"]
test = false
