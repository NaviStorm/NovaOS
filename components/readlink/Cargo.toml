[package]
name = "nova-readlink"
version = "0.24.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]

[[bin]]
name = "readlink"
path = "src/main.rs"

[target.'cfg(target_os = "none")'.dependencies]
nova-cli = { path = ".." }

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[features]
qualification = []

[[bin]]
name = "sonde"
path = "../../livraison-readlink-0240/lab/sonde.rs"
required-features = ["qualification"]
